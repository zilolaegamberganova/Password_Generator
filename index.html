<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parol Generator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="image-box">
            <img src="images/image.png" alt="Password Illustration">
        </div>

        <div class="form-box">
            <h1>Password Generator</h1>

            <input class="input" id="shortPass" readonly placeholder="Qisqa parol (6 ta)">
            <input class="input" id="normalPass" readonly placeholder="O'rtacha parol (10 ta)">
            <input class="input" id="longPass" readonly placeholder="Uzun parol (15 ta)">

            <button class="add-btn" id="generateBtn">Parol yaratish</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
